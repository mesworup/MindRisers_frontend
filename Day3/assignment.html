<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="">
        
        <label for="">Roll no:</label>
        <input type="number">
        <br>

        <label for="">Student name:</label>
        <input type="text" placeholder="First Name">
        -
        <input type="text" placeholder="Last Name">
        <br>

        <label for="">Father's name:</label>
        <input type="text">
        <br>

        <label for="">Date of birth:</label>
        <input type="number" placeholder="Day">-
        <input type="number" placeholder="Month">-
        <input type="number" placeholder="Year">
        (DD-MM-YYYY)
        <br>

        <label for="">Mobile no:</label>
        <input type="number" placeholder="+91">-
        <input type="number">
        <br>
        
        <label for="">Email id:</label>
        <input type="email">
        <br>

        <label for="">Password:</label>
        <input type="password">
        <br>

        <label for="">Gender:</label>
        <label for="male">Male</label>
        <input type="radio" id="male" value="male" name="confirm">
        <label for="female">Female:</label>
        <input type="radio" id="female" value="female" name="cofirm">
        <br>
        
        <label for="">Department:</label>
        <input type="checkbox">CSE
        <input type="checkbox">IT
        <input type="checkbox">ECE
        <input type="checkbox">Civil
        <input type="checkbox">Mech
        <br>

        <label for="">Course:</label>
        <select>
            <option value="">------- Select Current Course -------</option>
            <option value="BESE">BESE</option>
            <option value="BECE">BECE</option>
        </select>
        <br>

        <label for="">Student Photo:</label>
        <input type="image"> Choose an image
        <br>

        <label for="">City:</label>
        <input type="text">
        <br>

        <label for="">Address</label>
        <input type="text">
        <br>

        <button>Register</button>

    </form>
</body>
</html>
