<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        
        <!-- label tag is used to connect input type tag. eg label username is connected to input type text -->
        <label for="">Username</label><br>
        <input type="text" placeholder="ram">
        <br>
        
        <label for="">Phone</label><br>
        <input type="number" placeholder="9800000000"><br>
        <h3>I want to join mindrisers</h3>
        
        <!-- to select only yes or only no we add value and name -->
        <label for="yes">Yes</label>
        <input type="radio" id="yes" value="yes" name="confirm">

        <label for="no">No</label>
        <input type="radio" id="no" value="no" name="confirm">
<br>
        <button>Submit</button>
    </form>
    </body>
</html>
