<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>

    <style>
        /* universal selector*/

        *{
            margin: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        nav{
            height: 70px;
            background-color: rgb(237, 241, 242);

            /* display in single row */
            display: flex;
            
            /* justify is to manage rows spacing; justify-content: center;*/
            justify-content: space-around;

            /* align is to manage column spacing;*/
            align-items: center;  
        }

        ul{
            display: flex;
            flex-wrap: wrap;
            column-gap: 50px;
            list-style-type: none;  /*dont show defaul tbullet points */
        }

        /* element selector */
        a{
            color: black;
            text-decoration: none;  /*remove underline*/
        }

        /* id selector */
        #login{
            margin-right: 20px;
        }

        #signup{
            background-color: rgb(44, 229, 66);
            padding: 10px;
            border-radius: 10px;
            color: white;
        }
    </style>


</head>
<body>
    
    <nav>    
        <img src="../Day6/Logo.svg" alt="" width="150px">

        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">Service</a></li>
            <li><a href="">Feature</a></li>
            <li><a href="">Product</a></li>
            <li><a href="">FAQ</a></li>
            
        </ul>
        <div>
            <a href="" id="login">Login</a>
            <a href="" id="signup">Signup</a>
        </div>
    </nav>

</body>
</html>
